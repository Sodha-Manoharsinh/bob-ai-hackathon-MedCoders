submission:
  title: "Medical Report AI"

  problem_statement: >
    Many patients and clinicians struggle with fragmented medical records,
    scattered lab reports, and time-consuming document review. Critical
    findings are often buried in PDFs and images, making it hard to extract
    actionable insights quickly and accurately.

  solution_summary: >
    We built a full-stack medical document intelligence platform that uploads
    PDFs and images, extracts structured clinical facts, generates clear
    summaries, and answers patient-specific questions using AI grounded in the
    uploaded documents. This helps clinicians and patients understand medical
    data faster without relying on guesswork.

  key_features:
    - "Medical document upload with PDF/image parsing and OCR support"
    - "Structured extraction of lab results, diagnoses, medications, and vitals"
    - "AI-generated patient summary and clinical analysis dashboard"
    - "Question-answering assistant grounded strictly in uploaded records"
    - "Downloadable PDF clinical report for sharing and review"

  tech_stack:
    languages: ["TypeScript", "JavaScript"]
    frameworks: ["Express.js", "Node.js"]
    ibm_technologies: ["IBM Bob AI"]
    databases: ["JSON file store"]
    other: ["Tesseract OCR", "PDFKit", "Multer", "Google Gemini API"]

  what_we_are_most_proud_of: >
    We are most proud of building a solution that transforms noisy medical
    documents into structured, explainable insights while keeping the AI
    grounded in source data. The combination of extraction, summary
    generation, and Q&A makes the system practical for real-world medical
    workflows.

  known_limitations: >
    The platform depends on the quality of uploaded documents and OCR output,
    so low-resolution scans or poorly formatted records may reduce accuracy.
    It is a decision-support tool rather than a replacement for clinical
    judgment, and broader deployment would require stronger validation,
    security hardening, and integration with production medical systems.

